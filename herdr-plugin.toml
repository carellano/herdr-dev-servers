id = "carellano.apps"
name = "Herdr Apps"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Discover and safely inspect listening development applications."
platforms = ["linux", "macos"]

[[actions]]
id = "list"
title = "List listening applications"
contexts = ["workspace"]
command = ["herdr-apps", "list"]

[[panes]]
id = "apps"
title = "Herdr Apps"
placement = "popup"
width = "80%"
height = "80%"
command = ["herdr-apps", "tui"]
