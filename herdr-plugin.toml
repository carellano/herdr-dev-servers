id = "carellano.dev-servers"
name = "Herdr Dev Servers"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Discover and safely inspect listening development servers."
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "./herdr-dev-servers", "./cmd/herdr-dev-servers"]

[[startup]]
command = ["./herdr-dev-servers", "ensure-watch"]

[[events]]
on = "pane.created"
command = ["./herdr-dev-servers", "ensure-watch"]

[[actions]]
id = "open"
title = "Open Dev Servers"
contexts = ["workspace"]
command = ["./herdr-dev-servers", "open"]

[[panes]]
id = "dev-servers"
title = "Herdr Dev Servers"
placement = "popup"
width = "80%"
height = "80%"
command = ["./herdr-dev-servers", "tui"]
