version: 2
project_name: herdr-dev-servers

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: herdr-dev-servers
    main: ./cmd/herdr-dev-servers
    binary: herdr-dev-servers
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os | tolower }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
